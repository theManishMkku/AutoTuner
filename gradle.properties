package com.example.autotuner

import java.io.File
import java.nio.ByteBuffer
import java.nio.ByteOrder
import kotlin.math.PI
import kotlin.math.abs
import kotlin.math.cos
import kotlin.math.floor
import kotlin.math.log2
import kotlin.math.pow

object AutoTune {
    const val SR = 44100
    val NOTES = listOf("C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B")
    val SCALE_NAMES = listOf("Major", "Minor", "Chromatic")
    private val SCALES = mapOf(
        "Major" to intArrayOf(0, 2, 4, 5, 7, 9, 11),
        "Minor" to intArrayOf(0, 2, 3, 5, 7, 8, 10),
        "Chromatic" to IntArray(12) { it }
    )

    /** key = 0..11 (C..B), strength = 0..1 (1 = full snap to note) */
    fun process(input: ShortArray, key: Int, scale: String, strength: Float): ShortArray {
        val x = FloatArray(input.size) { input[it] / 32768f }
        val n = x.size
        val grain = 1024
        val hop = 256
        val out = FloatArray(n + grain)
        val wsum = FloatArray(n + grain)
        val win = FloatArray(grain) { (0.5 - 0.5 * cos(2 * PI * it / grain)).toFloat() }
        val allowed = SCALES[scale] ?: SCALES.getValue("Chromatic")

        var pos = 0
        var frame = 0
        var f0 = -1.0
        var prevRatio = 1f
        while (pos + grain < n) {
            val center = pos + grain / 2
            if (frame % 4 == 0) f0 = yin(x, center)
            var ratio = 1f
            if (f0 > 0) {
                val midi = 69 + 12 * log2(f0 / 440.0)
                val target = nearestNote(midi, key, allowed)
                val full = 2.0.pow((target - midi) / 12.0)
                ratio = full.pow(strength.toDouble()).toFloat()
            }
            ratio = prevRatio * 0.5f + ratio * 0.5f
            prevRatio = ratio
            for (i in 0 until grain) {
                val src = center + (i - grain / 2) * ratio
                out[pos + i] += interp(x, src) * win[i]
                wsum[pos + i] += win[i]
            }
            pos += hop
            frame++
        }
        return ShortArray(n) {
            val v = if (wsum[it] > 1e-3f) out[it] / wsum[it] else x[it]
            (v.coerceIn(-1f, 1f) * 32767f).toInt().toShort()
        }
    }

    private fun nearestNote(midi: Double, key: Int, allowed: IntArray): Int {
        val base = floor(midi).toInt()
        var best = base
        var bestDist = Double.MAX_VALUE
        for (k in base - 2..base + 3) {
            val degree = ((k - key) % 12 + 12) % 12
            if (degree in allowed) {
                val d = abs(k - midi)
                if (d < bestDist) { bestDist = d; best = k }
            }
        }
        return best
    }

    private fun interp(x: FloatArray, p: Float): Float {
        if (p < 0f) return 0f
        val i = p.toInt()
        if (i + 1 >= x.size) return 0f
        val f = p - i
        return x[i] * (1 - f) + x[i + 1] * f
    }

    /** YIN pitch detection. Returns Hz, or -1 if silent/unvoiced. */
    private fun yin(x: FloatArray, center: Int): Double {
        val w = 1024
        val maxTau = 700
        val minTau = 44
        val s = center - w / 2
        if (s < 0 || s + w + maxTau >= x.size) return -1.0
        var e = 0f
        for (j in 0 until w) e += x[s + j] * x[s + j]
        if (e / w < 1e-4f) return -1.0
        val c = FloatArray(maxTau)
        c[0] = 1f
        var run = 0f
        for (t in 1 until maxTau) {
            var sum = 0f
            for (j in 0 until w) {
                val df = x[s + j] - x[s + j + t]
                sum += df * df
            }
            run += sum
            c[t] = if (run > 0f) sum * t / run else 1f
        }
        var t = minTau
        while (t < maxTau - 1) {
            if (c[t] < 0.15f) {
                while (t + 1 < maxTau - 1 && c[t + 1] < c[t]) t++
                return SR.toDouble() / t
            }
            t++
        }
        return -1.0
    }

    fun writeWav(file: File, data: ShortArray) {
        val bytes = ByteBuffer.allocate(44 + data.size * 2).order(ByteOrder.LITTLE_ENDIAN)
        bytes.put("RIFF".toByteArray()); bytes.putInt(36 + data.size * 2)
        bytes.put("WAVE".toByteArray()); bytes.put("fmt ".toByteArray())
        bytes.putInt(16); bytes.putShort(1); bytes.putShort(1)
        bytes.putInt(SR); bytes.putInt(SR * 2); bytes.putShort(2); bytes.putShort(16)
        bytes.put("data".toByteArray()); bytes.putInt(data.size * 2)
        for (s in data) bytes.putShort(s)
        file.parentFile?.mkdirs()
        file.writeBytes(bytes.array())
    }
}
